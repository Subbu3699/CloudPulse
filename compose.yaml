
services:
  redis:
    image: redis:7-alpine
    container_name: cloudpulse-redis-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      RUNNING_IN_DOCKER: "true"
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        export DATABASE_URL="$$(python -c 'import os; from sqlalchemy.engine import make_url; u=make_url(os.environ["DATABASE_URL"]); print(u.set(host="host.docker.internal").render_as_string(hide_password=False))')"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      RUNNING_IN_DOCKER: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        export DATABASE_URL="$$(python -c 'import os; from sqlalchemy.engine import make_url; u=make_url(os.environ["DATABASE_URL"]); print(u.set(host="host.docker.internal").render_as_string(hide_password=False))')"
        exec celery -A app.celery_app:celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpulse-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
